ServiceCatalog:
  type: object
  description: >-
    Prices, cut-off times, limits and fees are null until GOFAST sets them; the pages then show the
    placeholder ([PRIX], [HEURE], [LIMITE], [TARIF]). Nothing is invented.
  required: [offers, parcel_types, extras, zones]
  additionalProperties: false
  properties:
    offers:
      type: array
      items:
        type: object
        required: [code, from_price_millimes, packaging_price_millimes, cutoff_time]
        additionalProperties: false
        properties:
          code: { $ref: "common.yaml#/ServiceCode" }
          from_price_millimes:
            oneOf: [{ $ref: "common.yaml#/Money" }, { type: "null" }]
          packaging_price_millimes:
            description: Added per parcel when the customer asks for GOFAST packaging. Null while not set.
            oneOf: [{ $ref: "common.yaml#/Money" }, { type: "null" }]
          cutoff_time:
            type: [string, "null"]
            description: Local time of day, HH:MM, Africa/Tunis.
    parcel_types:
      type: array
      items:
        type: object
        required: [code, limit]
        additionalProperties: false
        properties:
          code: { $ref: "common.yaml#/ParcelTypeCode" }
          limit: { type: [string, "null"] }
    extras:
      type: array
      items:
        type: object
        required: [code, fee_millimes]
        additionalProperties: false
        properties:
          code:
            type: string
            enum: [fragile, declaredValue, retry, return]
          fee_millimes:
            oneOf: [{ $ref: "common.yaml#/Money" }, { type: "null" }]
    zones:
      type: array
      description: The active délégations, for the picker. Never a polygon.
      items:
        type: object
        required: [id, name, governorate]
        additionalProperties: false
        properties:
          id: { $ref: "common.yaml#/ResourceId" }
          name: { type: string }
          governorate: { type: string }
ZoneCheckRequest:
  description: Exactly one of `pin` or `zone_id`.
  oneOf:
    - type: object
      required: [pin]
      additionalProperties: false
      properties:
        pin: { $ref: "common.yaml#/Pin" }
    - type: object
      required: [zone_id]
      additionalProperties: false
      properties:
        zone_id: { $ref: "common.yaml#/ResourceId" }
ZoneCheck:
  type: object
  description: >-
    R201. `zone_id` and `zone_name` are null when out of zone, and then `services` is empty and
    `reason` is `outOfZone` (an `apiErrors` key in fr, ar and en).
  required: [status, zone_id, zone_name, services, reason]
  additionalProperties: false
  properties:
    status:
      type: string
      enum: [in_zone, out_of_zone]
    zone_id:
      oneOf: [{ $ref: "common.yaml#/ResourceId" }, { type: "null" }]
    zone_name:
      type: [string, "null"]
    services:
      type: array
      items: { $ref: "common.yaml#/ServiceCode" }
    reason:
      oneOf:
        - type: string
          const: outOfZone
        - type: "null"
QuoteParcels:
  type: array
  minItems: 1
  items:
    type: object
    required: [weight_g]
    additionalProperties: false
    properties:
      weight_g:
        type: integer
        minimum: 1
        description: Declared weight of this parcel, in grams.
QuoteRequest:
  type: object
  required: [service, parcel_type, parcels, departure, arrival]
  additionalProperties: false
  properties:
    service: { $ref: "common.yaml#/ServiceCode" }
    parcel_type: { $ref: "common.yaml#/ParcelTypeCode" }
    parcels:
      description: >-
        One entry for each parcel, with its own weight (2 kg are included in the base price of each
        parcel). The maximum number (provisional 10) comes from the settings; more gives
        RULE_REFUSED `tooManyParcels` (so the schema sets no upper bound).
      $ref: "#/QuoteParcels"
    packaging:
      type: boolean
      default: false
      description: GOFAST packaging (reponses-gofast.md), for every parcel. Its price is in the `packaging` line.
    fragile:
      type: boolean
      default: false
    declared_value_millimes:
      oneOf: [{ $ref: "common.yaml#/Money" }, { type: "null" }]
    departure: { $ref: "common.yaml#/AddressInput" }
    arrival: { $ref: "common.yaml#/AddressInput" }
AmountLine:
  type: object
  description: >-
    One line of the price. `millimes` is `unit_millimes` times `count`, except for `weight` when the
    parcels differ: `unit_millimes` is then null and `millimes` is the sum of each parcel's own
    price. `millimes` is null while GOFAST has not
    confirmed the line (vat and stamp, see reponses-gofast.md). `base`, `weight` and `options` are
    per parcel (`count` is the number of parcels; `unit_millimes` is null for `weight` when the
    parcels differ). `distance`, `surcharge` and `stamp` are once per order (`count` is 1). `vat`
    is unchanged: null until the accountant confirms.
  required: [kind, unit_millimes, count, millimes]
  additionalProperties: false
  properties:
    kind:
      type: string
      enum: [base, distance, weight, options, packaging, surcharge, vat, stamp]
    unit_millimes:
      description: >-
        Price of one unit: one parcel for `base`, `weight` and `options`, the whole line for
        `distance`, `surcharge`, `vat` and `stamp` (`count` is 1). Null when the parcels differ
        (`weight`) or while the line is not confirmed.
      oneOf: [{ $ref: "common.yaml#/Money" }, { type: "null" }]
    count:
      type: integer
      minimum: 1
      description: The number of parcels for a per-parcel line; 1 for a once-per-order line.
    millimes:
      oneOf: [{ $ref: "common.yaml#/Money" }, { type: "null" }]
DiscountLine:
  type: object
  description: A discount line. Its amounts are negative or zero, the only ones that may be.
  required: [kind, unit_millimes, count, millimes]
  additionalProperties: false
  properties:
    kind:
      type: string
      const: discount
    unit_millimes: { $ref: "common.yaml#/DiscountMillimes" }
    count:
      type: integer
      minimum: 1
    millimes: { $ref: "common.yaml#/DiscountMillimes" }
PriceLine:
  description: Only a `discount` line may be negative.
  oneOf:
    - $ref: "#/AmountLine"
    - $ref: "#/DiscountLine"
Quote:
  type: object
  description: R204 and R205. Valid for the time in the settings (15 min), then recalculated and revalidated.
  required:
    [
      id,
      service,
      parcel_type,
      parcels,
      packaging,
      fragile,
      lines,
      total_millimes,
      tax_basis,
      amount_ht_millimes,
      amount_ttc_millimes,
      departure_pinned,
      arrival_pinned,
      surcharge,
      quoted_at,
      expires_at,
    ]
  additionalProperties: false
  properties:
    id: { $ref: "common.yaml#/ResourceId" }
    service: { $ref: "common.yaml#/ServiceCode" }
    parcel_type: { $ref: "common.yaml#/ParcelTypeCode" }
    parcels: { $ref: "#/QuoteParcels" }
    packaging: { type: boolean }
    fragile: { type: boolean }
    lines:
      type: array
      description: R204. One entry for each of base, distance, weight, options, packaging, surcharge, discount, vat and stamp, in that order, even at 0.
      items: { $ref: "#/PriceLine" }
    total_millimes:
      description: Sum (all parcels) of the lines that have a value. Whether it includes vat and stamp is open (TTC or HT).
      $ref: "common.yaml#/Money"
    tax_basis:
      description: Whether the prices are TTC or HT. Null while the admin has not set it (the current state).
      oneOf:
        - type: string
          enum: [ttc, ht]
        - type: "null"
    amount_ht_millimes:
      description: Null while the tax basis or the VAT is unknown.
      oneOf: [{ $ref: "common.yaml#/Money" }, { type: "null" }]
    amount_ttc_millimes:
      description: Null while the tax basis or the VAT is unknown.
      oneOf: [{ $ref: "common.yaml#/Money" }, { type: "null" }]
    departure_pinned:
      type: boolean
      description: True when the departure address came with a pin. Without one the order stays "à confirmer" (#22).
    arrival_pinned:
      type: boolean
      description: True when the arrival address came with a pin.
    surcharge:
      oneOf:
        - type: "null"
        - type: object
          description: R207. Name and ceiling are shown before the customer validates.
          required: [code, ceiling_millimes]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [rain]
            ceiling_millimes:
              oneOf: [{ $ref: "common.yaml#/Money" }, { type: "null" }]
    quoted_at: { $ref: "common.yaml#/UtcTimestamp" }
    expires_at: { $ref: "common.yaml#/UtcTimestamp" }
