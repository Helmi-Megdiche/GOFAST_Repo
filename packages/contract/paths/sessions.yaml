post:
  operationId: createSession
  summary: Sign in with a phone or an e-mail and a password
  description: >-
    Sets the session cookie and answers with the signed-in person. A wrong password and an unknown
    account give the same 401 AUTH_REQUIRED with `fields: [{ name: identifier, reason: invalidCredentials }]`, so
    the answer does not tell whether an account exists (a choice of this contract, not a rule of the
    cahier). Attempts are limited per account and per IP. A staff account (any role of the back-office)
    is refused here, whatever its password: it signs in with a second factor on `POST /v1/staff/sessions`
    and gets the same 401 `invalidCredentials` here (T60).
  tags: [auth]
  x-roles: [public]
  x-replay: none
  x-cahier: cahier
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: "../schemas/account.yaml#/SignInRequest" }
  responses:
    "201":
      description: Signed in.
      content:
        application/json:
          schema: { $ref: "../schemas/account.yaml#/Me" }
    "400": { $ref: "../responses/errors.yaml#/ValidationFailed" }
    "401": { $ref: "../responses/errors.yaml#/AuthRequired" }
    "403": { $ref: "../responses/errors.yaml#/AccessDenied" }
    "429": { $ref: "../responses/errors.yaml#/TooManyAttempts" }
    "500": { $ref: "../responses/errors.yaml#/InternalError" }
delete:
  operationId: deleteSession
  summary: Sign out
  tags: [auth]
  x-roles:
    [
      individual,
      merchant,
      agent,
      operations,
      logistics,
      customer_service,
      accountant,
      management,
      admin,
      driver,
      cashier,
    ]
  x-replay: none
  x-cahier: cahier
  responses:
    "204":
      description: Signed out. The session is removed from Redis.
    "401": { $ref: "../responses/errors.yaml#/AuthRequired" }
    "403": { $ref: "../responses/errors.yaml#/AccessDenied" }
    "500": { $ref: "../responses/errors.yaml#/InternalError" }
