post:
  operationId: createPhoneCheck
  summary: Send a verification code by SMS
  description: >-
    R102. The same answer for a known and an unknown phone. The SMS goes through the outbox.
    Attempts are limited (`TOO_MANY_ATTEMPTS` with `Retry-After`, both for a resend that comes too
    soon and for too many sends).
  tags: [auth]
  x-roles: [public]
  x-replay: none
  x-cahier: cahier
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: "../schemas/account.yaml#/PhoneCheckRequest" }
  responses:
    "202":
      description: A code was sent.
      content:
        application/json:
          schema: { $ref: "../schemas/account.yaml#/PhoneCheckSent" }
    "400": { $ref: "../responses/errors.yaml#/ValidationFailed" }
    "429": { $ref: "../responses/errors.yaml#/TooManyAttempts" }
    "503": { $ref: "../responses/errors.yaml#/ProviderUnavailable" }
    "500": { $ref: "../responses/errors.yaml#/InternalError" }
