get:
  operationId: getMe
  summary: The signed-in person and their account
  description: Addition to the cahier (ESP-02).
  tags: [account]
  x-roles:
    [
      individual,
      merchant,
      agent,
      operations,
      logistics,
      customer_service,
      accountant,
      management,
      admin,
      driver,
      cashier,
    ]
  x-replay: none
  x-cahier: addition
  responses:
    "200":
      description: The profile.
      content:
        application/json:
          schema: { $ref: "../schemas/account.yaml#/Me" }
    "401": { $ref: "../responses/errors.yaml#/AuthRequired" }
    "500": { $ref: "../responses/errors.yaml#/InternalError" }
patch:
  operationId: updateMe
  summary: Change name, language or notifications
  description: >-
    Addition to the cahier. R902: the language is saved for the person, not the account, and
    changes neither orders nor settings. The phone cannot be changed in L1.
  tags: [account]
  x-roles: [individual, merchant]
  x-replay: none
  x-cahier: addition
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: "../schemas/account.yaml#/MeChange" }
  responses:
    "200":
      description: The profile after the change.
      content:
        application/json:
          schema: { $ref: "../schemas/account.yaml#/Me" }
    "400": { $ref: "../responses/errors.yaml#/ValidationFailed" }
    "401": { $ref: "../responses/errors.yaml#/AuthRequired" }
    "403": { $ref: "../responses/errors.yaml#/AccessDenied" }
    "500": { $ref: "../responses/errors.yaml#/InternalError" }
delete:
  operationId: closeMe
  summary: Close the account
  description: >-
    Addition to the cahier. R105: the identity is erased and the accounting records stay. After it
    every writer scoped by the account refuses it, and the session ends.
  tags: [account]
  x-roles: [individual, merchant]
  x-replay: state
  x-cahier: addition
  responses:
    "204":
      description: The account is closed. Closing it again answers 204.
    "401": { $ref: "../responses/errors.yaml#/AuthRequired" }
    "403": { $ref: "../responses/errors.yaml#/AccessDenied" }
    "500": { $ref: "../responses/errors.yaml#/InternalError" }
