get:
  operationId: getOrder
  summary: Read one order
  description: An order of another account answers 404, not 403 (regles.md:153).
  tags: [orders]
  x-roles: [individual, merchant, agent, operations, admin, logistics, customer_service]
  x-replay: none
  x-cahier: cahier
  parameters:
    - $ref: "../parameters.yaml#/OrderId"
  responses:
    "200":
      description: The order.
      content:
        application/json:
          schema: { $ref: "../schemas/order.yaml#/Order" }
    "400": { $ref: "../responses/errors.yaml#/ValidationFailed" }
    "401": { $ref: "../responses/errors.yaml#/AuthRequired" }
    "403": { $ref: "../responses/errors.yaml#/AccessDenied" }
    "404": { $ref: "../responses/errors.yaml#/NotFound" }
    "500": { $ref: "../responses/errors.yaml#/InternalError" }
