patch:
  operationId: updateRecipient
  summary: Change a saved recipient
  description: Addition to the cahier. Another account's recipient answers 404.
  tags: [account]
  x-roles: [individual, merchant]
  x-replay: none
  x-cahier: addition
  parameters:
    - $ref: "../parameters.yaml#/RecipientId"
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: "../schemas/account.yaml#/SavedRecipientInput" }
  responses:
    "200":
      description: Saved.
      content:
        application/json:
          schema: { $ref: "../schemas/account.yaml#/SavedRecipient" }
    "400": { $ref: "../responses/errors.yaml#/ValidationFailed" }
    "401": { $ref: "../responses/errors.yaml#/AuthRequired" }
    "403": { $ref: "../responses/errors.yaml#/AccessDenied" }
    "404": { $ref: "../responses/errors.yaml#/NotFound" }
    "500": { $ref: "../responses/errors.yaml#/InternalError" }
delete:
  operationId: deleteRecipient
  summary: Delete a saved recipient
  description: Addition to the cahier. Another account's recipient answers 404.
  tags: [account]
  x-roles: [individual, merchant]
  x-replay: state
  x-cahier: addition
  parameters:
    - $ref: "../parameters.yaml#/RecipientId"
  responses:
    "204":
      description: Deleted. Deleting it again answers 204.
    "400": { $ref: "../responses/errors.yaml#/ValidationFailed" }
    "401": { $ref: "../responses/errors.yaml#/AuthRequired" }
    "403": { $ref: "../responses/errors.yaml#/AccessDenied" }
    "404": { $ref: "../responses/errors.yaml#/NotFound" }
    "500": { $ref: "../responses/errors.yaml#/InternalError" }
