post:
  operationId: confirmOrder
  summary: Confirm an order that waits for an agent
  description: >-
    R209, D8. The system confirms an order by itself only for a verified customer under the amount
    set in the settings; an agent confirms the others. Replay by state: an order that is already
    confirmed answers 200 again with no new event. An order that is not waiting for confirmation (for
    example canceled) answers 409 STATE_CONFLICT with the field `status` and the reason
    `notWaitingForConfirmation`.
  tags: [orders]
  x-roles: [agent, operations, admin]
  x-replay: state
  x-cahier: cahier
  parameters:
    - $ref: "../parameters.yaml#/OrderId"
  responses:
    "200":
      description: The order is confirmed.
      content:
        application/json:
          schema: { $ref: "../schemas/order.yaml#/Order" }
    "400": { $ref: "../responses/errors.yaml#/ValidationFailed" }
    "401": { $ref: "../responses/errors.yaml#/AuthRequired" }
    "403": { $ref: "../responses/errors.yaml#/AccessDenied" }
    "404": { $ref: "../responses/errors.yaml#/NotFound" }
    "409": { $ref: "../responses/errors.yaml#/StateConflict" }
    "500": { $ref: "../responses/errors.yaml#/InternalError" }
