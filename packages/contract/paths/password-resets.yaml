post:
  operationId: createPasswordReset
  summary: Set a new password after a verified phone
  description: >-
    Addition to the cahier. The phone must have been verified for the purpose `reset`. The answer
    is the same whether or not the phone has an account (decision 16).
  tags: [auth]
  x-roles: [public]
  x-replay: none
  x-cahier: addition
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: "../schemas/account.yaml#/PasswordResetRequest" }
  responses:
    "204":
      description: Done.
    "400": { $ref: "../responses/errors.yaml#/ValidationFailed" }
    "422": { $ref: "../responses/errors.yaml#/RuleRefused" }
    "429": { $ref: "../responses/errors.yaml#/TooManyAttempts" }
    "500": { $ref: "../responses/errors.yaml#/InternalError" }
