post:
  operationId: cancelOrder
  summary: Cancel an order
  description: >-
    R212. Free before the driver arrived, with a fee after, and after the pickup a claim instead.
    Replay by state: an order that is already canceled answers 200 again with no new event.
    Refusals, all with nothing written: 422 RULE_REFUSED `feeRequired` when `accepted_fee` is not
    the fee that applies now; 409 STATE_CONFLICT with the field `status` and the reason `claimOnly`
    (after the pickup) or `notCancellable` (a final state).
  tags: [orders]
  x-roles: [individual, merchant, agent, operations, logistics, admin]
  x-replay: state
  x-cahier: cahier
  parameters:
    - $ref: "../parameters.yaml#/OrderId"
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: "../schemas/order.yaml#/CancelRequest" }
  responses:
    "200":
      description: The order is canceled.
      content:
        application/json:
          schema: { $ref: "../schemas/order.yaml#/CancelResult" }
    "400": { $ref: "../responses/errors.yaml#/ValidationFailed" }
    "401": { $ref: "../responses/errors.yaml#/AuthRequired" }
    "403": { $ref: "../responses/errors.yaml#/AccessDenied" }
    "404": { $ref: "../responses/errors.yaml#/NotFound" }
    "409": { $ref: "../responses/errors.yaml#/StateConflict" }
    "422": { $ref: "../responses/errors.yaml#/RuleRefused" }
    "500": { $ref: "../responses/errors.yaml#/InternalError" }
