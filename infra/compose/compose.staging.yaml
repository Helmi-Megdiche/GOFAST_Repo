# Staging override (#14 PR 3). Use with the base file and the server's env file:
#   docker compose -f compose.yaml -f compose.staging.yaml --env-file /opt/gofast/secrets/staging.env up -d --wait
# Locally: --env-file .env.staging.example (fake domain, Caddy's internal certificate), see README.
services:
  caddy:
    environment:
      SITE_ADDRESS: ${STAGING_DOMAIN:?set STAGING_DOMAIN in the env file}
      CADDY_MODE: staging
      CADDY_TLS: ${CADDY_TLS:-acme}
      STAGING_USER: ${STAGING_USER:-gofast}
      STAGING_PASSWORD_HASH: ${STAGING_PASSWORD_HASH:?bcrypt hash from caddy hash-password, in the env file}
  api:
    environment:
      # Exactly one hop between the internet and the api: Caddy. Fixed here, not read from the env file.
      TRUST_PROXY: "1"
      ALLOWED_ORIGINS: https://${STAGING_DOMAIN}
    # With TRUST_PROXY=1 the api believes the address in X-Forwarded-For from whoever connects. On staging
    # Caddy must be the only way in, so no host port at all for api, ws and web (the data ports stay on
    # 127.0.0.1, reached by SSH tunnel only: infra/servers/README.md).
    ports: !reset []
  ws:
    ports: !reset []
  web:
    ports: !reset []
  # No db-setup on staging: it sits behind the `setup` profile, and the staging env file never sets
  # COMPOSE_PROFILES, so `up` does not start it (check.sh staging asserts it). It is run by hand once.
