# CI for every pull request and every push to main (#13, #76).
# Actions are pinned by commit SHA; the tag is in the comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `code` is false only when every changed file is under docs/ or infra/ or is a Markdown
  # file. A push to main is always code. Plain git, no third-party action.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether code changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          api=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE_SHA" HEAD)
            echo "Changed files:"
            echo "$files"
            if [ -n "$files" ]; then
              code=false
              api=false
              while IFS= read -r f; do
                case "$f" in
                  docs/* | infra/* | *.md) ;;
                  apps/api/* | packages/contract/* | packages/i18n/* | packages/domain/* | packages/config/* | turbo.json | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | .node-version | .github/*) code=true; api=true ;;
                  *) code=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "code=$code"
          echo "api=$api"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm (version from package.json)
        run: |
          npm install -g corepack@latest
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Three machines, each runs a third of the tests (one worker per machine).
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/3
    needs: [checks, changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm (version from package.json)
        run: |
          npm install -g corepack@latest
          corepack enable
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium and its system libraries
        working-directory: apps/web
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # playwright.config.ts builds apps/web and serves it on port 3100 by itself.
      # With CI=true it writes a blob report, merged by the e2e-report job.
      - name: Run this shard
        run: pnpm --filter @fastgo/web exec playwright test --shard=${{ matrix.shard }}/3

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 14

      - name: Upload traces and screenshots of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 14

  # One HTML report from the three blobs, named as before.
  e2e-report:
    name: E2E report
    needs: e2e-shard
    if: ${{ !cancelled() && needs.e2e-shard.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm (version from package.json)
        run: |
          npm install -g corepack@latest
          corepack enable
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: apps/web/all-blob-reports
          merge-multiple: true

      - name: Merge the shard reports
        working-directory: apps/web
        run: |
          pnpm exec playwright merge-reports --reporter list ./all-blob-reports | tail -n 40
          pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  # The check name seen on a PR. Green when every shard passed, or when the shards were
  # skipped because only docs and infra changed. Red on a failed or cancelled shard, and
  # also when the shards did not run although code changed (a failed `checks` job).
  e2e:
    name: E2E (Playwright, axe-core)
    needs: [changes, e2e-shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarise the shards
        env:
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "code=$CODE shards=$SHARDS"
          if [ "$SHARDS" = "success" ]; then exit 0; fi
          if [ "$SHARDS" = "skipped" ] && [ "$CODE" = "false" ]; then
            echo "Only docs, Markdown or infra changed: e2e skipped."
            exit 0
          fi
          echo "e2e did not pass."
          exit 1

  # Integration tests of the API: Docker is on the runner (Testcontainers, Schemathesis). #7, #21.
  api-int:
    name: API integration tests
    needs: [checks, changes]
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm (version from package.json)
        run: |
          npm install -g corepack@latest
          corepack enable
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fastgo/contract bundle
      - run: pnpm --filter @fastgo/api test:int

  # The one name to require for the API: green when the integration tests passed, or were skipped
  # because nothing the API depends on changed. Red when they failed or did not run although they should have.
  api:
    name: API (tests, contract)
    needs: [changes, api-int]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarise the API tests
        env:
          API: ${{ needs.changes.outputs.api }}
          INT: ${{ needs.api-int.result }}
        run: |
          echo "api=$API api-int=$INT"
          if [ "$INT" = "success" ]; then exit 0; fi
          if [ "$INT" = "skipped" ] && [ "$API" = "false" ]; then exit 0; fi
          echo "API integration tests did not pass."
          exit 1

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
