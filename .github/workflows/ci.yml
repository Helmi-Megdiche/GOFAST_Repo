# CI for every pull request and every push to main (#13, #76).
# Actions are pinned by commit SHA; the tag is in the comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `code` is false only when every changed file is under docs/ or infra/ or is a Markdown
  # file. A push to main is always code. Plain git, no third-party action.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether code changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE_SHA" HEAD)
            echo "Changed files:"
            echo "$files"
            if [ -n "$files" ]; then
              code=false
              while IFS= read -r f; do
                case "$f" in
                  docs/* | infra/* | *.md) ;;
                  *) code=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm (version from package.json)
        run: |
          npm install -g corepack@latest
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # On a push to main, the merge commit usually has the same git tree as the merge commit
  # that already passed e2e on its PR (main did not move in between). Same tree = same code,
  # so the shards are skipped. The PR run leaves its tree in the `e2e-tree` artifact.
  # This job never fails: on any API error it says "not passed" and e2e runs as usual.
  e2e-prior:
    name: E2E already passed on the PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tree: ${{ steps.prior.outputs.tree }}
      passed: ${{ steps.prior.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Look for a PR run that passed e2e on this tree
        id: prior
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          tree=$(git rev-parse 'HEAD^{tree}')
          passed=false
          pr_head=$(git rev-parse -q --verify 'HEAD^2')
          if [ "$EVENT" = "push" ] && [ -n "$pr_head" ]; then
            ids=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$pr_head&per_page=20" \
              --jq '.workflow_runs[] | select(.conclusion == "success") | .id')
            for id in $ids; do
              rm -rf prior
              if gh run download "$id" --repo "$REPO" --name e2e-tree --dir prior \
                && [ "$(cat prior/tree)" = "$tree" ]; then
                echo "PR run $id passed e2e on the same tree."
                passed=true
                break
              fi
            done
          fi
          echo "tree=$tree passed=$passed"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  # Three machines, each runs a third of the tests (one worker per machine).
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/3
    needs: [checks, changes, e2e-prior]
    if: >-
      ${{ !cancelled() && needs.checks.result == 'success' && needs.changes.outputs.code == 'true'
      && needs.e2e-prior.outputs.passed != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm (version from package.json)
        run: |
          npm install -g corepack@latest
          corepack enable
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium and its system libraries
        working-directory: apps/web
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # playwright.config.ts builds apps/web and serves it on port 3100 by itself.
      # With CI=true it writes a blob report, merged by the e2e-report job.
      - name: Run this shard
        run: pnpm --filter @fastgo/web exec playwright test --shard=${{ matrix.shard }}/3

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 14

      - name: Upload traces and screenshots of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 14

  # One HTML report from the three blobs, named as before.
  e2e-report:
    name: E2E report
    needs: [e2e-shard, e2e-prior]
    if: ${{ !cancelled() && needs.e2e-shard.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm (version from package.json)
        run: |
          npm install -g corepack@latest
          corepack enable
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: apps/web/all-blob-reports
          merge-multiple: true

      - name: Merge the shard reports
        working-directory: apps/web
        run: |
          pnpm exec playwright merge-reports --reporter list ./all-blob-reports | tail -n 40
          pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

      # Read by `e2e-prior` on the push to main after the merge.
      - name: Record the tree that passed e2e
        if: ${{ github.event_name == 'pull_request' && needs.e2e-shard.result == 'success' }}
        env:
          TREE: ${{ needs.e2e-prior.outputs.tree }}
        run: mkdir -p e2e-tree && echo "$TREE" > e2e-tree/tree

      - name: Upload the tree that passed e2e
        if: ${{ github.event_name == 'pull_request' && needs.e2e-shard.result == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tree
          path: e2e-tree
          retention-days: 7

  # The check name seen on a PR. Green when every shard passed, or when the shards were
  # skipped because only docs and infra changed, or (push to main) because the same tree
  # already passed e2e on its PR. Red on a failed or cancelled shard, and
  # also when the shards did not run although code changed (a failed `checks` job).
  e2e:
    name: E2E (Playwright, axe-core)
    needs: [changes, e2e-shard, e2e-prior]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarise the shards
        env:
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.e2e-shard.result }}
          PRIOR: ${{ needs.e2e-prior.outputs.passed }}
        run: |
          echo "code=$CODE shards=$SHARDS prior=$PRIOR"
          if [ "$SHARDS" = "success" ]; then exit 0; fi
          if [ "$SHARDS" = "skipped" ] && [ "$CODE" = "false" ]; then
            echo "Only docs, Markdown or infra changed: e2e skipped."
            exit 0
          fi
          if [ "$SHARDS" = "skipped" ] && [ "$PRIOR" = "true" ]; then
            echo "This tree already passed e2e on its PR: e2e skipped."
            exit 0
          fi
          echo "e2e did not pass."
          exit 1

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
