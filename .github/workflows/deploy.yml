# Staging deploy (#14 PR 4). Runs only after CI succeeded on a push to main (or by hand on main).
# Never on pull_request, never for a fork: the workflow_run guard below checks the event and the repository.
# Build once, tag = full commit SHA, then ask the staging host to deploy that SHA over SSH. The host runs one
# forced command (infra/servers/deploy.sh) that accepts only `deploy <sha> <api digest> <web digest>` and
# `rollback`, and pulls and runs the images by DIGEST: what this job pushed is exactly what runs.
# Runs finish in any order; deploy.sh refuses a commit older than the one running (a red run, on purpose).
# No host, address, key or token is written here: they are environment secrets of `staging`.
# Actions are pinned by commit SHA; the tag is in the comment. Plain docker and ssh otherwise.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      api_digest: ${{ steps.push.outputs.api_digest }}
      web_digest: ${{ steps.push.outputs.web_digest }}
    steps:
      - name: Commit to deploy
        id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a full commit sha"; exit 1; }
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push api and web
        id: push
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          SITE_URL: ${{ vars.SITE_URL }}
          API_DOMAINS: ${{ vars.API_DOMAINS }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          src="https://github.com/$GITHUB_REPOSITORY"
          api="ghcr.io/$owner/gofast-api:$SHA"
          web="ghcr.io/$owner/gofast-web:$SHA"
          docker build -f infra/docker/api.Dockerfile --label "org.opencontainers.image.source=$src" --label "org.opencontainers.image.revision=$SHA" -t "$api" .
          docker build -f infra/docker/web.Dockerfile --label "org.opencontainers.image.source=$src" --label "org.opencontainers.image.revision=$SHA" \
            --build-arg "NEXT_PUBLIC_SITE_URL=${SITE_URL:-https://staging.invalid}" --build-arg "NEXT_PUBLIC_API_DOMAINS=$API_DOMAINS" -t "$web" .
          docker push "$api"
          docker push "$web"
          # The digest the registry now holds for each push. The deploy asks for these, never for a tag.
          digest() { # image name -> sha256:<64 hex>
            local d; d=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$1" | grep "^ghcr.io/$owner/$2@" | head -n 1)
            d="${d#*@}"
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no valid digest for $2"; exit 1; }
            printf '%s' "$d"
          }
          api_digest=$(digest "$api" gofast-api)
          web_digest=$(digest "$web" gofast-web)
          { echo "api_digest=$api_digest"; echo "web_digest=$web_digest"; } >> "$GITHUB_OUTPUT"
          {
            echo "### Images pushed"
            echo "- \`gofast-api\` \`${api_digest:0:19}…\` and \`gofast-web\` \`${web_digest:0:19}…\` for commit \`${SHA:0:12}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions: {}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      # A job-level `if` cannot read secrets, so this step decides. Without the three environment secrets
      # the job is green and says so: nothing is deployed, nothing fails.
      - name: Check staging secrets
        id: gate
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          if [ -n "$HOST" ] && [ -n "$KEY" ] && [ -n "$KNOWN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo "The \`staging\` environment has no STAGING_HOST, STAGING_SSH_KEY and STAGING_KNOWN_HOSTS yet, so nothing was deployed. The images were built and pushed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy over SSH (forced command)
        if: steps.gate.outputs.have == 'true'
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN: ${{ secrets.STAGING_KNOWN_HOSTS }}
          SHA: ${{ needs.build.outputs.sha }}
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.build.outputs.web_digest }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a full commit sha"; exit 1; }
          [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "api digest missing or malformed"; exit 1; }
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "web digest missing or malformed"; exit 1; }
          [[ "$HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo "STAGING_HOST is not a plain host name or address"; exit 1; }
          dir="$(mktemp -d "$RUNNER_TEMP/ssh.XXXXXX")"
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$KEY" > "$dir/key"
          printf '%s\n' "$KNOWN" > "$dir/known_hosts"
          # The host key is pinned: an unknown or changed key fails, nothing is trusted on first use.
          ssh -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=20 \
            "deploy@$HOST" "deploy $SHA $API_DIGEST $WEB_DIGEST"
          echo "### Deployed to staging: \`${SHA:0:12}\` (api \`${API_DIGEST:0:19}…\`, web \`${WEB_DIGEST:0:19}…\`)" >> "$GITHUB_STEP_SUMMARY"
